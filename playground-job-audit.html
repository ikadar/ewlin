<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux - Audit Production Jobs</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232736;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-dim: #8b90a0;
    --accent: #6c8cff;
    --accent-dim: #3d5299;
    --green: #4ade80;
    --green-dim: #166534;
    --orange: #fb923c;
    --orange-dim: #7c4a1e;
    --red: #f87171;
    --red-dim: #7f1d1d;
    --cyan: #67e8f9;
    --purple: #c084fc;
    --yellow: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }

  /* Layout */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 320px;
    min-width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header span { color: var(--text-dim); font-weight: 400; font-size: 12px; }
  .job-list { flex: 1; overflow-y: auto; }
  .job-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .job-item:hover { background: var(--surface2); }
  .job-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
  .job-item .ref { font-weight: 600; font-size: 14px; }
  .job-item .client { color: var(--text-dim); font-size: 12px; }
  .job-item .desc { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .job-item .meta { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; }
  .job-item .meta .tag {
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .tag-ok { background: var(--green-dim); color: var(--green); }
  .tag-late { background: var(--red-dim); color: var(--red); }
  .tag-partial { background: var(--orange-dim); color: var(--orange); }

  .main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .main h1 { font-size: 20px; margin-bottom: 4px; }
  .main .subtitle { color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }

  /* Summary cards */
  .summary-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    min-width: 160px;
    flex: 1;
  }
  .card .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .card .value { font-size: 22px; font-weight: 700; }
  .card .detail { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  /* Task table */
  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .badge {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th {
    text-align: left;
    padding: 10px 14px;
    background: var(--surface2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }

  .station-name { font-weight: 600; white-space: nowrap; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
  .dim { color: var(--text-dim); }

  /* Duration bar */
  .duration-bar-container { position: relative; height: 20px; margin-top: 4px; }
  .duration-bar {
    height: 100%;
    border-radius: 3px;
    position: absolute;
    top: 0;
    opacity: 0.85;
  }
  .bar-setup { background: var(--orange); }
  .bar-run { background: var(--accent); }
  .bar-idle { background: #444; }
  .bar-legend { display: flex; gap: 12px; font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .bar-legend span { display: flex; align-items: center; gap: 4px; }
  .bar-legend .dot { width: 8px; height: 8px; border-radius: 2px; }

  /* Operator sub-table */
  .op-table { width: 100%; margin: -4px 0; }
  .op-table td { padding: 3px 8px; font-size: 12px; border-bottom: none; vertical-align: middle; }
  .op-name { font-weight: 500; white-space: nowrap; }
  .attention-bar {
    display: inline-block;
    height: 12px;
    border-radius: 2px;
    background: var(--accent);
    vertical-align: middle;
  }
  .attention-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Timeline mini-gantt */
  .gantt-container {
    background: var(--surface2);
    border-radius: 6px;
    padding: 12px 16px;
    margin-top: 16px;
    border: 1px solid var(--border);
  }
  .gantt-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .gantt-header .title { font-size: 12px; font-weight: 600; }
  .gantt-header .range { font-size: 11px; color: var(--text-dim); }
  .gantt-row { display: flex; align-items: center; margin-bottom: 4px; }
  .gantt-label { width: 100px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gantt-track { flex: 1; height: 18px; background: var(--bg); border-radius: 3px; position: relative; overflow: hidden; }
  .gantt-block {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    color: white;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 3px;
  }
  .gantt-block.setup { background: var(--orange); opacity: 0.9; }
  .gantt-block.run { background: var(--accent); opacity: 0.9; }
  .gantt-block.masked { background: var(--purple); opacity: 0.9; }
  .gantt-block.idle { background: #444; opacity: 0.5; }
  .gantt-time-axis { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dim); margin-top: 2px; padding-left: 100px; }

  /* Delta indicators */
  .delta { font-size: 11px; font-weight: 600; }
  .delta.positive { color: var(--red); }
  .delta.negative { color: var(--green); }
  .delta.neutral { color: var(--text-dim); }

  /* Masked badge */
  .masked-badge {
    background: #5b21b6;
    color: var(--purple);
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 6px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

// === DATA PROCESSING ===
const stationMap = Object.fromEntries(SNAPSHOT.stations.map(s => [s.id, s]));
const operatorMap = Object.fromEntries(SNAPSHOT.operators.map(o => [o.id, o]));
const taskMap = Object.fromEntries(SNAPSHOT.tasks.map(t => [t.id, t]));
const elementMap = Object.fromEntries(SNAPSHOT.elements.map(e => [e.id, e]));
const assignmentByTask = Object.fromEntries(SNAPSHOT.assignments.map(a => [a.taskId, a]));

// Build proficiency lookup: proficiencyMap[operatorId][stationId] = proficiency
const proficiencyMap = {};
SNAPSHOT.operators.forEach(op => {
  proficiencyMap[op.id] = {};
  (op.skills || []).forEach(sk => {
    proficiencyMap[op.id][sk.stationId] = sk.proficiency;
  });
});

function parseDate(s) { return new Date(s); }
function formatTime(d) {
  if (!(d instanceof Date) || isNaN(d)) return '??:??';
  return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function formatDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return '??';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function formatDateTime(d) { return formatDate(d) + ' ' + formatTime(d); }
function diffMinutes(a, b) { return Math.round((b - a) / 60000); }
function fmtDuration(mins) {
  if (mins < 60) return mins + 'min';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? h + 'h' + String(m).padStart(2, '0') : h + 'h';
}

// Build enriched job data
const jobs = SNAPSHOT.jobs.map(job => {
  const jobElements = SNAPSHOT.elements.filter(e => e.jobId === job.id);
  const jobTasks = SNAPSHOT.tasks.filter(t => t.jobId === job.id).sort((a, b) => a.sequenceOrder - b.sequenceOrder);

  let theoreticalTotal = 0;
  let productionTotal = 0;
  let allScheduled = true;

  const enrichedTasks = jobTasks.map(task => {
    const assignment = assignmentByTask[task.id];
    const station = stationMap[task.stationId];
    const setupMin = task.duration?.setupMinutes || 0;
    const runMin = task.duration?.runMinutes || 0;
    const theoreticalMin = setupMin + runMin;
    theoreticalTotal += theoreticalMin;

    let productionMin = theoreticalMin; // default if no assignment
    let proficiency = 1;
    let operators = [];
    let scheduledStart = null;
    let scheduledEnd = null;
    let calendarMin = 0;
    let isMasked = false;

    if (assignment) {
      scheduledStart = parseDate(assignment.scheduledStart);
      scheduledEnd = parseDate(assignment.scheduledEnd);
      calendarMin = diffMinutes(scheduledStart, scheduledEnd);
      isMasked = assignment.isMaskedTime;

      operators = (assignment.operators || []).map(op => {
        const opData = operatorMap[op.operatorId];
        const from = parseDate(op.from);
        const to = parseDate(op.to);
        const opProf = proficiencyMap[op.operatorId]?.[task.stationId] || 1;
        return {
          id: op.operatorId,
          name: opData ? opData.firstName + ' ' + opData.lastName : op.operatorId.slice(0, 8),
          role: opData?.role || '',
          attention: op.attention,
          proficiency: opProf,
          from, to,
          durationMin: diffMinutes(from, to),
        };
      });

      // Production time = theoretical / effective proficiency
      // If multiple operators, use weighted average proficiency by duration
      if (operators.length > 0) {
        const totalOpMinutes = operators.reduce((s, o) => s + o.durationMin, 0);
        if (totalOpMinutes > 0) {
          proficiency = operators.reduce((s, o) => s + o.proficiency * (o.durationMin / totalOpMinutes), 0);
        } else {
          proficiency = operators[0].proficiency;
        }
      }
      productionMin = Math.round(theoreticalMin / proficiency);
      productionTotal += productionMin;
    } else {
      allScheduled = false;
    }

    const delta = productionMin - theoreticalMin;

    return {
      id: task.id,
      sequenceOrder: task.sequenceOrder,
      station: station?.name || '?',
      stationId: task.stationId,
      setupMin, runMin, theoreticalMin,
      productionMin, calendarMin, delta, proficiency,
      operators,
      scheduledStart, scheduledEnd,
      isMasked,
      isScheduled: !!assignment,
      status: task.status,
    };
  });

  const deadline = parseDate(job.workshopExitDate + ':00');
  const lastEnd = enrichedTasks.filter(t => t.scheduledEnd).map(t => t.scheduledEnd).sort((a, b) => b - a)[0];
  const isLate = lastEnd && lastEnd > deadline;
  const allDone = enrichedTasks.every(t => t.isScheduled);

  return {
    id: job.id,
    reference: job.reference,
    client: job.client,
    description: job.description,
    color: job.color,
    deadline,
    workshopExitDate: job.workshopExitDate,
    tasks: enrichedTasks,
    elements: jobElements,
    theoreticalTotal,
    productionTotal,
    deltaTotal: productionTotal - theoreticalTotal,
    isLate,
    allScheduled: allDone,
    lastEnd,
  };
}).sort((a, b) => a.reference.localeCompare(b.reference, undefined, { numeric: true }));

// === RENDER SIDEBAR ===
const jobListEl = document.getElementById('job-list');
document.getElementById('job-count').textContent = `${jobs.length} jobs`;

jobs.forEach((job, i) => {
  const el = document.createElement('div');
  el.className = 'job-item';
  el.dataset.index = i;

  const statusTag = job.isLate ? '<span class="tag tag-late">En retard</span>' :
                    job.allScheduled ? '<span class="tag tag-ok">OK</span>' :
                    '<span class="tag tag-partial">Partiel</span>';

  el.innerHTML = `
    <div class="ref">#${job.reference} <span style="color:var(--text-dim);font-weight:400">${job.client}</span></div>
    <div class="desc">${job.description}</div>
    <div class="meta">
      ${statusTag}
      <span style="color:var(--text-dim)">${job.tasks.length} taches</span>
      <span style="color:var(--text-dim)">${fmtDuration(job.theoreticalTotal)} theo.</span>
    </div>
  `;
  el.addEventListener('click', () => selectJob(i));
  jobListEl.appendChild(el);
});

// === RENDER JOB DETAIL ===
let selectedIndex = -1;

function selectJob(index) {
  selectedIndex = index;
  document.querySelectorAll('.job-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  renderJobDetail(jobs[index]);
}

              <td class="mono" style="font-weight:600">${fmtDuration(task.theoreticalMin)}</td>
              <td class="mono">${task.isScheduled ? formatDateTime(task.scheduledStart) : '<span class="dim">-</span>'}</td>
              <td class="mono">${task.isScheduled ? formatDateTime(task.scheduledEnd) : '<span class="dim">-</span>'}</td>
              <td class="mono dim">${task.isScheduled ? fmtDuration(task.calendarMin) : '-'}</td>
              <td class="mono" style="font-weight:600">${task.isScheduled ? fmtDuration(task.productionMin) : '-'}</td>
              <td>
                ${task.isScheduled ? `<span class="delta ${task.delta > 0 ? 'positive' : task.delta < 0 ? 'negative' : 'neutral'}">${task.delta > 0 ? '+' : ''}${task.delta}min</span>${task.proficiency !== 1 ? ` <span class="dim" style="font-size:10px">(comp. ${task.proficiency.toFixed(2)})</span>` : ''}` : ''}
              </td>
              <td>
                ${task.operators.length > 0 ? `
                  <table class="op-table">
                    ${task.operators.map(op => `
                      <tr>
                        <td class="op-name">${op.name}</td>
                        <td class="mono dim">${formatTime(op.from)} - ${formatTime(op.to)}</td>
                        <td class="mono">${fmtDuration(op.durationMin)}</td>
                        <td>
                          <span class="attention-bar" style="width:${Math.round(op.attention * 40)}px"></span>
                          <span class="attention-value">${Math.round(op.attention * 100)}%</span>
                        </td>
                        <td class="mono dim" title="Competence">comp. ${op.proficiency.toFixed(1)}</td>
                      </tr>
                    `).join('')}
                  </table>
                ` : '<span class="dim">Aucun</span>'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <!-- Efficiency analysis -->
    <div class="section">
      <div class="section-title">Analyse</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px">
        ${job.tasks.filter(t => t.isScheduled && t.delta > 0).length > 0 ? `
          <div style="margin-bottom:12px">
            <strong style="color:var(--orange)">Taches avec surtemps de production :</strong>
            <ul style="margin-top:4px;padding-left:20px;color:var(--text-dim)">
              ${job.tasks.filter(t => t.isScheduled && t.delta > 0).map(t => `
                <li><strong>${t.station}</strong>: +${t.delta}min (production ${fmtDuration(t.productionMin)} vs theo. ${fmtDuration(t.theoreticalMin)})
                  ${t.proficiency < 1 ? ` - competence ${t.proficiency.toFixed(2)} (x${(1/t.proficiency).toFixed(1)} plus lent)` : ''}
                  ${t.isMasked ? ' - temps masque' : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        ` : '<div style="color:var(--green);margin-bottom:8px">Aucun surtemps - tous les operateurs a competence 1</div>'}
        ${job.tasks.filter(t => !t.isScheduled).length > 0 ? `
          <div style="color:var(--red)">
            <strong>Taches non planifiees :</strong>
            ${job.tasks.filter(t => !t.isScheduled).map(t => t.station).join(', ')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

// Auto-select first job
if (jobs.length > 0) selectJob(0);
</script>

</body>
</html>
