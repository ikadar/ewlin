# Mapping de transformation des dossiers MasterPrint vers les jobs Flux.
# Editable sans toucher au code Python. Rechargé à chaque exécution.

api:
  base_url: http://localhost/api/v1
  auth:
    email: ordo@wheel.digital
    password_env: FLUX_API_PASSWORD

# NUSEC à ignorer systématiquement (CTP = prepresse, TRANS = logistique,
# *ENC = info comptable, PAO = prepresse design)
skip_nusec: [CTP, TRANS, "*ENC", PAO]

# Operations à transformer en tâches sous-traitées
outsourcing:
  trigger_nusec: ST
  default_provider: Inconnu
  default_days: 3
  default_action_type: divers
  transit_days: 1

  # CDMAC on ST operations → specific provider + action type (pelliculage, vernis)
  cdmac_rules:
    PLB:  { provider: Pelliculage ST, action_type: pelliculage brillant }
    PLM:  { provider: Pelliculage ST, action_type: pelliculage mat }
    PLT:  { provider: Pelliculage ST, action_type: pelliculage toilé }
    PMAT: { provider: Pelliculage ST, action_type: pelliculage mat anti-rayures }
    VUV:  { provider: Pelliculage ST, action_type: vernis UV }

  # Known provider patterns from LIBOP (first match wins, case-insensitive)
  # "match" = substring to find in LIBOP. "provider" = canonical provider name.
  # "action_type" overrides default; omit to derive from cleaned LIBOP.
  provider_rules:
    - match: "AF 37"
      provider: AF 37
      action_type: reliure
    - match: "AF37"
      provider: AF 37
      action_type: reliure
    - match: "ROUTAGE 86"
      provider: Routage 86
      action_type: routage
    - match: "PUBLITEX"
      provider: Publitex
    - match: "PUBITEX"
      provider: Publitex
    - match: "PRESSE DE TOURAINE"
      provider: Presse de Touraine
    - match: "PRESSE TOURAINE"
      provider: Presse de Touraine
    - match: "TRANSPORTS JEANTET"
      provider: Transports Jeantet
      action_type: transport
    - match: "RAYNAUD"
      provider: Raynaud Imprimeurs
    - match: "BROCHURE RAPIDE"
      provider: Brochure Rapide
    - match: "GEPSA"
      provider: Gepsa

# Mapping NUSEC -> Station (avec règles)
# rule types : fixed | duration_threshold | postes_threshold | format_threshold | composite
mapping:
  MASSI:
    rule: duration_threshold
    threshold_minutes: 20
    le: P137
    gt: P137N
    # Normalize MASSI tasks: collapse setup into run (0+X), floor 5 min total.
    # Rationale: MasterPrint splits massicot work into many tiny ops (Refente,
    # Coupe finition, etc.) on the same physical machine. Setup is bundled
    # into run, and durations below 5 min are bumped — single short task per
    # MASSI op, no phantom-short tiles.
    normalize:
      collapse_to_run: true
      min_total_minutes: 5

  CONDI:
    rule: libop_keywords
    default: Conditionnement      # fallback pour libellés non reconnus
    patterns:
      - keywords: [film, bande]
        station: Filmeuse
      - keywords: [carton, étui, etui]
        station: Cartonnage
      - keywords: [palette]
        station: Palettisation

  PLIAG:
    rule: composite
    branches:
      - if: { pagination_eq: 16 }
        choose: Stahl
      - if: { grammage_gte: 150 }
        choose: MBO
      - default: Stahl

  ASSDU:
    rule: postes_threshold
    threshold: 5
    le: Duplo 10P
    gt: Duplo 20P

  ASSEM:
    rule: postes_threshold
    threshold: 5
    le: Duplo 10P
    gt: Duplo 20P

  ENCA:
    rule: fixed
    station: Heidelberg

  CYLIN:
    rule: format_threshold
    max_small_cm: [35, 49]
    small: Typo Petit Format
    large: Typo Grand Format

  FACO:
    rule: fixed
    station: Table

  TABLE:
    rule: fixed
    station: Table

# Mapping CDMAC (référentiel dv_machf) → nom de station Flux.
# Source : dv_cximp.CDMAC_1 = code de la presse retenue. Si absent ici, le
# builder retombe sur dv_machf.LIBMA (libellé lisible) comme nom de station.
press_mapping:
  G37: G37
  G37-5: G37          # variante 5 couleurs, même station physique
  "754": "754"
  "754G": "754"       # variante typographique du même CDMAC
  GTO: GTO
  RICOH: Ricoh 9500
  "928": "928-2"
  "928-2": "928-2"

defaults:
  deadline_relative_working_days_fallback: 10
  element_global_name: GLOBAL
  element_paper_name_template: "PAP{n}"
  papier_template: "{LIBSO}:{GRAMM}"

paths:
  inbox: /opt/flux/inbox/masterprint
  report: /opt/flux/inbox/masterprint/last_import_report.json
  log: /var/log/flux-masterprint-import.log
