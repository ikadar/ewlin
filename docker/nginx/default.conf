server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # CORS is handled by NelmioCorsBundle — do not add CORS headers here

    # Natural-language console (Node service) — must come before catch-all `/`.
    # Forwards Authorization header verbatim so the Node service can proxy
    # the JWT through to the PHP API.
    location /console/ {
        proxy_pass http://console-service:3004/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Long timeout for the LLM execute loop (Gemma can take ~10-30s).
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # MCP server HTTP transport (for external MCP clients hitting nginx).
    location /mcp {
        proxy_pass http://console-service:3004/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;

        # Prevent URIs from being interpreted as PHP
        internal;
    }

    # Return 404 for all other php files
    location ~ \.php$ {
        return 404;
    }

    # Healthcheck endpoint (static file bypass)
    location = /health {
        try_files $uri /index.php$is_args$args;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
