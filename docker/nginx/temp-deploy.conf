server {
    listen 80 default_server;
    server_name _;

    # ===== Frontend SPA (React build) =====
    root /var/www/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== PHP API at /api/* =====
    location /api/ {
        root /var/www/html/public;
        rewrite ^/api/(.*)$ /api/$1 break;
        try_files $uri /index.php$is_args$args;
    }

    # ===== AI palette (console-service) =====
    location /console/ {
        proxy_pass http://console-service:3004/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== MCP HTTP transport =====
    location /mcp {
        proxy_pass http://console-service:3004/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Mercure SSE proxy
    location /.well-known/mercure {
        proxy_pass http://mercure:3000/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
        proxy_cache off;
    }

    # PHP-FPM execution for /api/index.php
    location ~ ^/index\.php(/|$) {
        root /var/www/html/public;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        internal;
    }

    # Block direct access to other PHP files
    location ~ \.php$ {
        return 404;
    }

    # Health probe
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    client_max_body_size 32M;
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
