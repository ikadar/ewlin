<svg xmlns="http://www.w3.org/2000/svg" width="14" height="28" shape-rendering="crispEdges">
  <!-- Operator overtime overlay.
       Neutral mid-gray plus-sign grid in a 14×28 tile: one full cross centered
       at (7,7) plus corner fragments at y=21 that fuse with neighbouring tiles
       into a full cross when the pattern repeats. Net: ~2 crosses per cell,
       staggered like brickwork. Same SVG used in light and dark mode — gray
       at 0.45 opacity reads on both backgrounds. -->
  <line x1="3.5" y1="7" x2="10.5" y2="7" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
  <line x1="7" y1="3.5" x2="7" y2="10.5" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
  <line x1="-3.5" y1="21" x2="3.5" y2="21" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
  <line x1="0" y1="17.5" x2="0" y2="24.5" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
  <line x1="10.5" y1="21" x2="17.5" y2="21" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
  <line x1="14" y1="17.5" x2="14" y2="24.5" stroke="rgba(122,122,122,0.45)" stroke-width="1" stroke-linecap="square"/>
</svg>
